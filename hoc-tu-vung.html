        .search-box { width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 1rem; margin-bottom: 15px; transition: border-color 0.3s; }

        .filter-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        .filter-btn { padding: 10px 18px; border: none; border-radius: 8px; background: #e2e8f0; cursor: pointer; transition: all 0.3s; font-weight: 500; }
        .filter-btn.active { background: var(--primary); color: white; }
        .view-controls { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
        .view-btn { padding: 8px 16px; border-radius: 6px; border: 2px solid var(--primary); background: white; color: var(--primary); cursor: pointer; font-weight: 500; transition: all 0.2s; }
        .view-btn:hover, .view-btn.active { background: var(--primary); color: white; }
        .stats { margin-top: 15px; color: var(--secondary); font-size: 0.95rem; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .word-card { background: white; border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; transition: transform 0.3s, box-shadow 0.3s; cursor: pointer; perspective: 1000px; }
        .word-card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        .card-inner { position: relative; width: 100%; height: 160px; transition: transform 0.6s; transform-style: preserve-3d; }
        .word-card.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
        .card-front { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: white; }
        .card-back { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; transform: rotateY(180deg); }
        .en-word { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
        .topic-tag { font-size: 0.75rem; background: rgba(255,255,255,0.25); padding: 3px 10px; border-radius: 20px; }
        .vi-meaning { font-size: 1.2rem; line-height: 1.5; }
        .table-view { width: 100%; border-collapse: separate; border-spacing: 0; border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); display: none; }
        .table-view th, .table-view td { padding: 14px 18px; text-align: left; background: white; border-bottom: 1px solid #e2e8f0; }
        .table-view th { background: var(--primary); color: white; font-weight: 600; }
        .table-view tr:hover td { background: #f0fdf4; }
        .topic-cell { font-size: 0.8rem; color: var(--secondary); }
        .hidden-meaning { color: transparent; background: #cbd5e1; border-radius: 4px; user-select: none; }
        .show-meaning .hidden-meaning { color: inherit; background: transparent; }

        footer { text-align: center; margin-top: 40px; color: var(--secondary); font-size: 0.9rem; }
